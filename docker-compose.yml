# SARAL Self-Hosted Services
# ===========================
# PostgreSQL runs LOCALLY on your machine (not Docker)
# This file runs: MinIO (file storage) + Redis (cache) only
#
# Start all services: docker compose up -d
# Stop all services:  docker compose down

services:
  # ===== Redis =====
  # Used for: view counters, rate limits, sessions, cache
  # Production equivalent: AWS ElastiCache Redis
  redis:
    image: redis:7-alpine
    container_name: saral-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== MinIO (S3-compatible object storage) =====
  # Used for: video files, thumbnails
  # SAME API as AWS S3 - production code stays identical
  # Production equivalent: AWS S3
  minio:
    image: minio/minio:latest
    container_name: saral-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: saral_minio_admin
      MINIO_ROOT_PASSWORD: saral_minio_password
    ports:
      - "9000:9000"   # API port (S3-compatible) - your app talks to this
      - "9001:9001"   # Web console - browse files at http://localhost:9001
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ===== MinIO Bucket Auto-Setup =====
  # Creates required buckets on first run, then exits
  minio-setup:
    image: minio/mc:latest
    container_name: saral-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 saral_minio_admin saral_minio_password;
      mc mb --ignore-existing local/saral-videos;
      mc mb --ignore-existing local/saral-thumbnails;
      mc mb --ignore-existing local/saral-avatars;
      mc anonymous set download local/saral-videos;
      mc anonymous set download local/saral-thumbnails;
      mc anonymous set download local/saral-avatars;
      echo 'Buckets created successfully';
      exit 0;
      "

volumes:
  redis_data:
  minio_data:
